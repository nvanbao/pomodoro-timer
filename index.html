<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro-time</title>
    <link-ref="stylesheet" href="style.css"></link-ref>
</head>
<body>
    <main class="card">
        <h1 >Pomodoro time</h1>
        <div class="modes">
            <button data-mode="focus">Tập trung</button>
            <button data-mode="short">Nghỉ ngắn</button>
            <button data-mode="long">Nghỉ dài</button>
        </div>
        <div id="time">25:00</div>
        <div class="progress"><div id="progress-bar"></div></div>
        <div class="controls">
            <button id="start">Bắt đầu</button>
            <button id="pause">Tạm dừng</button>
            <button id="reset">Đặt lại</button>
        </div>
        <p id="status"></p>
        <p>Số phiên đã hoàn thành :<span id="count">0</span></p>
    </main>
    <script src="script.js"></script>
</body>
</html>
